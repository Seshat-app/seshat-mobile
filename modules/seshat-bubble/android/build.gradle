plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.seshatbubble'
version = '1.0.0'

android {
  namespace "expo.modules.seshatbubble"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "com.facebook.react:react-android"
}
